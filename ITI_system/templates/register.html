 {% extends 'base.html' %}

{% block content %}

<div class="content-card col-md-5 mx-auto">

    <h2 class="mb-2 text-center">Register</h2>
    <p class="text-muted text-center">
        Create an <strong>Instructor</strong> or <strong>Trainee</strong> account to test permissions.
    </p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-main w-100">
            Register
        </button>
    </form>
    <p class="text-muted text-center mt-3 mb-0">
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>

</div>

{% endblock %}
