{% extends 'base.html' %}
{% block content %}
<h2>Trainees List</h2>
<a href="{% url 'trainee:add_trainee' %}">Add Trainee</a>
<ul>
  {% for t in trainees %}
    <li>{{ t.name }} - {{ t.email }} 
      <a href="{% url 'trainee:update_trainee' t.id %}">Update</a>
      <a href="{% url 'trainee:delete_trainee' t.id %}">Delete</a>
    </li>
  {% endfor %}
</ul>
{% endblock %}
