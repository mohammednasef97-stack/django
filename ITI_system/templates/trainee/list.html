{% extends 'base.html' %}
{% block content %}
<h2>قائمة المتدربين</h2>
<a href="{% url 'add_trainee' %}">إضافة متدرب</a>
<ul>
  {% for t in trainees %}
    <li>{{ t.name }} - {{ t.email }} 
      <a href="{% url 'update_trainee' t.id %}">تعديل</a>
      <a href="{% url 'delete_trainee' t.id %}">حذف</a>
    </li>
  {% endfor %}
</ul>
{% endblock %}
