{# Reusable flash area — included from base.html #}
{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'debug' %}secondary{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show shadow-sm" role="alert">
            <div class="d-flex align-items-start gap-2">
                <span class="mt-1" aria-hidden="true">
                    {% if message.tags == 'success' %}✓{% elif message.tags == 'error' %}!{% elif message.tags == 'warning' %}⚠{% else %}ℹ{% endif %}
                </span>
                <div class="flex-grow-1">{{ message }}</div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Dismiss"></button>
            </div>
        </div>
    {% endfor %}
{% endif %}
