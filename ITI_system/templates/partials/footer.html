<footer class="border-top mt-5 py-4 bg-white bg-opacity-75">
    <div class="container">
        <div class="row align-items-center gy-2 small text-muted">
            <div class="col-md-6">
                <strong class="text-body">ITI Learning Portal</strong> — course, trainee, and instructor records with role-based access.
            </div>
            <div class="col-md-6 text-md-end">
                {% now "Y" as current_year %}
                <span>&copy; {{ current_year }} ITI System</span>
                {% if user.is_authenticated %}
                    <span class="mx-2">·</span>
                    <span>Signed in as <strong class="text-body">{{ user.username }}</strong></span>
                {% endif %}
            </div>
        </div>
    </div>
</footer>
