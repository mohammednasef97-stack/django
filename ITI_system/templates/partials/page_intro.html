{# Wrap with {% with page_title="..." page_subtitle="..." %} before include #}
{% if page_title %}
<div class="page-hero p-4 mb-4 shadow-sm">
    <h1 class="h3 mb-1 text-primary-emphasis">{{ page_title }}</h1>
    {% if page_subtitle %}
        <p class="text-muted small mb-0">{{ page_subtitle }}</p>
    {% endif %}
</div>
{% endif %}
