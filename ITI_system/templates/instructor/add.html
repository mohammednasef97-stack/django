 {% extends 'base.html' %}

{% block content %}

<div class="content-card col-md-6 mx-auto">

    <h2 class="mb-2">{{ page_title|default:"Add Instructor" }}</h2>
    <p class="text-muted">{{ page_subtitle|default:"Create or update instructor profile." }}</p>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-main w-100">
            {% if is_edit %}Update Instructor{% else %}Save Instructor{% endif %}
        </button>
    </form>

</div>

{% endblock %}
